<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marble WebXR Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
    <script type="importmap">
      {
        "imports": {
          "three": "/static/vendor/three/three.module.js",
          "three/addons/": "/static/vendor/three/examples/jsm/",
          "three-mesh-bvh": "/static/vendor/three-mesh-bvh/index.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app-root" class="app-root"></div>

    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-ring" aria-hidden="true"></div>
      <p class="loading-title">Museo ng Libingan<br /><em>sa Ilalim ng Lupa ng Nagcarlan</em><span>Preparing the 3D Environment…</span></p>
      <p id="loading-text" class="loading-text" aria-live="polite">Initializing…</p>
      <div class="progress-track">
        <div id="loading-progress" class="progress-fill"></div>
      </div>
    </div>

    <div id="error-banner" class="error-banner hidden"></div>

    <aside id="interaction-panel" class="interaction-panel hidden">
      <h2 id="interaction-name">Object</h2>
      <pre id="interaction-meta"></pre>
    </aside>

    <aside id="position-debug-panel" class="position-debug-panel hidden" aria-label="Museum player coordinates">
      <span id="position-debug-label" class="position-debug-panel__label">Player coordinates</span>
      <output id="position-debug-value" class="position-debug-panel__value">[0.00, 0.00, 0.00]</output>
      <div class="position-debug-panel__footer">
        <span id="position-debug-hint" class="position-debug-panel__hint">X, Y, Z</span>
        <button id="position-debug-copy" class="position-debug-panel__copy" type="button" aria-label="Copy player coordinates">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="8" width="11" height="11" rx="2"></rect>
            <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
          </svg>
          <span id="position-debug-copy-label" aria-live="polite">Copy</span>
        </button>
      </div>
    </aside>

    <section id="mobile-controls" class="tour-control-dock" aria-label="Movement and navigation controls">
      <div id="xr-button-container" class="tour-control-dock__xr" aria-label="XR mode controls"></div>

      <div id="move-stick-zone" class="tour-control-dock__camera" role="application" aria-label="Move joystick">
        <div id="move-stick-thumb" class="tour-control-dock__joystick-thumb" aria-hidden="true"></div>
        <span class="tour-control-dock__camera-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 6.25a5.75 5.75 0 1 1 0 11.5 5.75 5.75 0 0 1 0-11.5Zm0 1.5a4.25 4.25 0 1 0 0 8.5 4.25 4.25 0 0 0 0-8.5ZM12 2a.75.75 0 0 1 .75.75v2a.75.75 0 0 1-1.5 0v-2A.75.75 0 0 1 12 2Zm0 17.25a.75.75 0 0 1 .75.75v2a.75.75 0 0 1-1.5 0v-2a.75.75 0 0 1 .75-.75ZM4.75 11.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h2Zm16.5 0a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h2Z" fill="currentColor"></path>
          </svg>
        </span>
        <span class="tour-control-dock__label">Move</span>
      </div>

      <button id="control-fullscreen-button" class="tour-control-dock__action" type="button" aria-label="Toggle fullscreen" aria-pressed="false">
        <span class="tour-control-dock__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 9.25c.41 0 .75-.34.75-.75V5.75H7.5a.75.75 0 0 0 0-1.5H4A1.25 1.25 0 0 0 2.75 5.5v3a.75.75 0 0 0 .75.75Zm12.5-5a.75.75 0 0 0 0 1.5h2.75V8.5a.75.75 0 0 0 1.5 0v-3A1.25 1.25 0 0 0 19.5 4.25h-3Zm3.5 10a.75.75 0 0 0-.75.75v2.75H16.5a.75.75 0 0 0 0 1.5h3A1.25 1.25 0 0 0 20.75 18v-3a.75.75 0 0 0-.75-.75Zm-16.5 0a.75.75 0 0 0-.75.75v3A1.25 1.25 0 0 0 4 19.25h3.5a.75.75 0 0 0 0-1.5H4.75V15a.75.75 0 0 0-.75-.75Z" fill="currentColor"></path>
          </svg>
        </span>
        <span class="tour-control-dock__label">Full</span>
      </button>

      <button id="control-back-button" class="tour-control-dock__action" type="button" aria-label="Back to intro">
        <span class="tour-control-dock__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M10.53 5.47a.75.75 0 0 1 0 1.06L5.81 11.25H20a.75.75 0 0 1 0 1.5H5.81l4.72 4.72a.75.75 0 1 1-1.06 1.06l-6-6a.75.75 0 0 1 0-1.06l6-6a.75.75 0 0 1 1.06 0Z" fill="currentColor"></path>
          </svg>
        </span>
        <span class="tour-control-dock__label">Back</span>
      </button>
    </section>

    <script type="module" src="{{ url_for('static', filename='js/main.js', v='20260811-door-gaze-portal-15') }}"></script>
  </body>
</html>
