<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>{{ admin_document_title or 'NHCP Admin' }}</title>
    <link rel="icon" type="image/jpeg" href="/images/UndergroundLogo.jpg" />
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/admin-dashboard.css') }}" />
    <script defer src="{{ url_for('static', filename='admin/js/admin-dashboard.js') }}"></script>
  </head>
  <body class="admin-dashboard-page">
    <div class="{{ admin_layout_class or 'admin-layout' }}">
      <div class="admin-sidebar-overlay" data-sidebar-overlay></div>
      {% include 'admin/_sidebar.html' %}

      <div class="admin-main">
        {% include 'admin/_topbar.html' %}

        <main class="admin-content">
          {% block admin_content %}{% endblock %}
        </main>
      </div>
    </div>

    <div
      class="admin-confirm-modal"
      data-admin-confirm-modal
      role="dialog"
      aria-modal="true"
      aria-labelledby="adminConfirmTitle"
      aria-describedby="adminConfirmMessage"
      aria-hidden="true"
      hidden
    >
      <section class="admin-confirm-dialog" role="document">
        <div class="admin-confirm-accent" aria-hidden="true"></div>
        <div class="admin-confirm-icon" data-admin-confirm-icon aria-hidden="true">
          <svg class="admin-confirm-icon-disable" viewBox="0 0 24 24">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 2a8 8 0 0 1 5.2 14.08L5.92 6.8A7.94 7.94 0 0 1 12 4Zm-8 8a7.94 7.94 0 0 1 .8-3.48L15.48 19.2A8 8 0 0 1 4 12Z"></path>
          </svg>
          <svg class="admin-confirm-icon-enable" viewBox="0 0 24 24">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm-1.25 14.2-4.1-4.1 1.4-1.4 2.7 2.7 5.2-5.2 1.4 1.4Z"></path>
          </svg>
        </div>
        <p class="admin-confirm-eyebrow">Account access</p>
        <h2 id="adminConfirmTitle" class="admin-confirm-title" data-admin-confirm-title>Confirm action</h2>
        <p id="adminConfirmMessage" class="admin-confirm-message" data-admin-confirm-message></p>
        <div class="admin-confirm-actions">
          <button type="button" class="admin-confirm-cancel" data-admin-confirm-cancel>Cancel</button>
          <button type="button" class="admin-confirm-submit" data-admin-confirm-approve>Confirm</button>
        </div>
      </section>
    </div>
  </body>
</html>
