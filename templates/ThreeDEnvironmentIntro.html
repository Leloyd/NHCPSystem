<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Environment Intro | Museo ng Libingan sa Ilalim ng Lupa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}" />
    <script type="importmap">
      {
        "imports": {
          "three": "/webxr/static/vendor/three/three.module.js",
          "three/addons/": "/webxr/static/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="bg-stone-950 text-white">
    <main>
      <section class="landing-intro relative h-screen min-h-[680px] overflow-hidden" data-auto-start="true">
        <div id="landingIntro3d" class="absolute inset-0" aria-hidden="true"></div>

        <div class="landing-intro-overlay">
          <a id="landingIntroChurch" href="{{ url_for('three_d_environment_runtime') }}" class="landing-intro-church hidden" aria-label="Open Church runtime">
            <span class="landing-intro-church__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 3.25a.75.75 0 0 1 .53.22l5 5A.75.75 0 0 1 17 9.75h-1.25v7A1.25 1.25 0 0 1 14.5 18h-1.75v-3.25a.75.75 0 0 0-1.5 0V18H9.5a1.25 1.25 0 0 1-1.25-1.25v-7H7a.75.75 0 0 1-.53-1.28l5-5a.75.75 0 0 1 .53-.22Z" fill="currentColor"></path>
              </svg>
            </span>
            <span class="landing-intro-church__label">Church</span>
          </a>

          <p id="landingIntroStatus" class="landing-intro-status" aria-live="polite">Loading church environment preview...</p>
        </div>
      </section>
    </main>

    <script type="module" src="{{ url_for('static', filename='js/landing-splat-intro.js') }}"></script>
  </body>
</html>
