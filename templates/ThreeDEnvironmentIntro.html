<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Environment Intro | Museo ng Libingan sa Ilalim ng Lupa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}" />
  </head>
  <body class="bg-stone-950 text-white">
    <main>
      <section class="landing-intro relative h-screen min-h-[680px] overflow-hidden" data-auto-start="true">
        <div id="landingIntro3d" class="absolute inset-0" aria-hidden="true"></div>
        <div class="landing-intro-gradient absolute inset-0"></div>

        <div class="landing-intro-copy relative h-full flex items-end justify-center text-white px-4 pb-10 md:pb-14">
          <div class="text-center max-w-4xl">
            <div class="flex flex-wrap justify-center gap-4 mb-3">
              <a id="landingIntroChurch" href="{{ url_for('three_d_environment_runtime') }}" class="landing-intro-church hidden">
                Church
              </a>
            </div>

            <p id="landingIntroStatus" class="landing-intro-status">Preparing walls, gates, and church model...</p>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="{{ url_for('static', filename='js/landing-3d.js') }}"></script>
  </body>
</html>
