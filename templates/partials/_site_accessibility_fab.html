{# Floating accessibility launcher for public pages — available to everyone,
   signed in or not. Controls are wired by static/js/site-prefs.js. #}
<div id="siteA11yRoot" class="site-a11y">
  <div class="site-a11y-panel" role="dialog" aria-label="Accessibility controls">
    <div class="site-a11y-head">
      <span class="site-a11y-title"><span data-lang-en>Accessibility</span><span data-lang-tl>Aksesibilidad</span></span>
      <button type="button" class="site-a11y-close" data-a11y-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <p class="site-a11y-label"><span data-lang-en>Theme</span><span data-lang-tl>Tema</span></p>
    <div class="site-a11y-seg" role="group" aria-label="Theme">
      <button type="button" class="site-a11y-seg-btn" data-set-theme="light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span data-lang-en>Light</span><span data-lang-tl>Liwanag</span>
      </button>
      <button type="button" class="site-a11y-seg-btn" data-set-theme="dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <span data-lang-en>Dark</span><span data-lang-tl>Dilim</span>
      </button>
    </div>

    <button type="button" class="site-a11y-switch" data-toggle-contrast role="switch" aria-checked="false">
      <span><span data-lang-en>High contrast</span><span data-lang-tl>Mataas na kontrast</span></span>
      <span class="site-a11y-switch-track" aria-hidden="true"></span>
    </button>

    <p class="site-a11y-label"><span data-lang-en>Text size</span><span data-lang-tl>Laki ng teksto</span></p>
    <div class="site-a11y-seg" role="group" aria-label="Text size">
      <button type="button" class="site-a11y-seg-btn" data-set-textsize="small" style="font-size:0.72rem;">A</button>
      <button type="button" class="site-a11y-seg-btn" data-set-textsize="medium" style="font-size:0.9rem;">A</button>
      <button type="button" class="site-a11y-seg-btn" data-set-textsize="large" style="font-size:1.1rem;">A</button>
    </div>

    <p class="site-a11y-label"><span data-lang-en>Language</span><span data-lang-tl>Wika</span></p>
    <div class="site-a11y-seg" role="group" aria-label="Language">
      <button type="button" class="site-a11y-seg-btn" data-set-lang="en">English</button>
      <button type="button" class="site-a11y-seg-btn" data-set-lang="tl">Tagalog</button>
    </div>
  </div>

  <button type="button" class="site-a11y-fab" data-a11y-toggle aria-label="Accessibility options" aria-expanded="false" aria-haspopup="dialog">
    <i data-lucide="accessibility" aria-hidden="true"></i>
  </button>
</div>
