<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Balanghay AR Viewer</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Georgia, serif;
      }

      body {
        position: fixed;
        inset: 0;
      }

      .ar-overlay {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 10px) 10px calc(env(safe-area-inset-left, 0px) + 10px);
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0));
        color: #fff;
      }

      .ar-back {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(217, 119, 6, 0.95);
        color: #fff;
        text-decoration: none;
        font-size: 14px;
      }

      .ar-note {
        position: fixed;
        left: calc(env(safe-area-inset-left, 0px) + 8px);
        right: calc(env(safe-area-inset-right, 0px) + 8px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
        z-index: 20;
        border-radius: 10px;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.6);
        color: #f5f5f4;
        font-size: 13px;
        line-height: 1.45;
      }

      #arjs-video,
      a-scene video {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100dvh !important;
        object-fit: contain !important;
        z-index: 0 !important;
        background: #000 !important;
      }

      a-scene,
      .a-canvas {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100dvh !important;
        z-index: 1 !important;
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div class="ar-overlay">
      <a href="/ar-content" class="ar-back">← Back to AR Content</a>
      <div>Balanghay • Hiro Marker</div>
    </div>

    <div class="ar-note">
      Point your camera to a <strong>Hiro marker</strong>. Once detected, the Balanghay 3D model appears on top of the marker.
    </div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true"
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    >
      <a-assets>
        <a-asset-item id="balanghayModel" src="{{ url_for('static', filename='AR-Artifacts/Balanghay/Balanghay.glb') }}"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro">
        <a-entity gltf-model="#balanghayModel" position="0 0 0" rotation="0 0 0" scale="1 1 1"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
