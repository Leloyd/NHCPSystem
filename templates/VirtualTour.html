<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1017" />
    <title>Virtual Tour | Museo ng Libingan sa Ilalim ng Lupa</title>
    <link rel="preload" as="image" href="{{ url_for('static', filename='360VirtualTour/FrontGate.jpg') }}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ar.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/virtual-tour.css') }}" />
  </head>
  <body class="tour-body">
    <div class="ar-overlay ar-overlay--top tour-overlay-top">
      <a href="/digital-exhibits" class="ar-btn ar-btn--back">← Back</a>
    </div>

    <main
      class="tour-app"
      id="tourApp"
      data-panorama-src="{{ url_for('static', filename='360VirtualTour/FrontGate.jpg') }}"
      data-panorama-title="Front Gate Panorama"
      data-panorama-subtitle="Drag to look around the site and use scroll or pinch to zoom."
      data-panorama-left-src="{{ url_for('static', filename='360VirtualTour/left-FrontGate.jpg') }}"
      data-panorama-left-title="Left Front Gate Panorama"
      data-panorama-left-subtitle="Continue exploring from a left-side perspective of the front gate."
    >
      <div class="tour-viewer" id="tourViewer" aria-label="Interactive 360 virtual tour"></div>

      <div class="tour-overlay tour-overlay--bottom-left">
        <section class="tour-info-card" aria-live="polite">
          <p class="tour-info-card__kicker">360 Virtual Tour</p>
          <h1 id="tourTitle" class="tour-info-card__title">Front Gate Panorama</h1>
          <p id="tourSubtitle" class="tour-info-card__copy">
            Drag to look around the site and use scroll or pinch to zoom.
          </p>
        </section>
      </div>

      <div class="tour-overlay tour-overlay--center" id="tourLoadingOverlay">
        <section class="tour-status-card">
          <p class="tour-status-card__title">Loading 360 view...</p>
          <p class="tour-status-card__copy">Preparing the panoramic scene for smooth navigation.</p>
        </section>
      </div>

      <div class="tour-overlay tour-overlay--center" id="tourErrorOverlay" hidden>
        <section class="tour-status-card tour-status-card--error">
          <p class="tour-status-card__title">Unable to load the panorama</p>
          <p class="tour-status-card__copy">Please refresh the page or return to Digital Exhibits and try again.</p>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="{{ url_for('static', filename='js/virtual-tour.js') }}"></script>
  </body>
</html>
