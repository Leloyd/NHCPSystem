<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1017" />
    <title>Virtual Tour | Museo ng Libingan sa Ilalim ng Lupa</title>
    <link rel="preload" as="image" href="{{ url_for('static', filename='360VirtualTour/FrontGate.jpg') }}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ar.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/virtual-tour.css') }}" />
  </head>
  <body class="tour-body">
   

    <main
      class="tour-app"
      id="tourApp"
      data-panorama-src="{{ url_for('static', filename='360VirtualTour/FrontGate.jpg') }}"
      data-panorama-title="Front Gate Panorama"
      data-panorama-subtitle="Drag to look around the site and use scroll or pinch to zoom."
      data-panorama-left-src="{{ url_for('static', filename='360VirtualTour/left-FrontGate.jpg') }}"
      data-panorama-right-src="{{ url_for('static', filename='360VirtualTour/right-FrontGate.jpg') }}"
      data-panorama-inside-front-gate-src="{{ url_for('static', filename='360VirtualTour/Inside-FrontGate.jpg') }}"
      data-panorama-inside-front-gate1-src="{{ url_for('static', filename='360VirtualTour/1Inside-FrontGate.jpg') }}"
      data-panorama-middle-g-inside-src="{{ url_for('static', filename='360VirtualTour/MiddleG-Inside.jpg') }}"
      data-panorama-front-church-src="{{ url_for('static', filename='360VirtualTour/FrontChurch.jpg') }}"
      data-panorama-right-front-church-src="{{ url_for('static', filename='360VirtualTour/right-FrontChurch.jpg') }}"
      data-panorama-left-front-church-src="{{ url_for('static', filename='360VirtualTour/left-FrontChurch.jpg') }}"
      data-panorama-inside-church-src="{{ url_for('static', filename='360VirtualTour/InsideChurch.jpg') }}"
      data-panorama-inside-church1-src="{{ url_for('static', filename='360VirtualTour/1InsideChurch.jpg') }}"
      data-panorama-stairs-church-src="{{ url_for('static', filename='360VirtualTour/stairs-Church.jpg') }}"
      data-panorama-underground1-src="{{ url_for('static', filename='360VirtualTour/1Underground.jpg') }}"
      data-panorama-middle-underground-src="{{ url_for('static', filename='360VirtualTour/MiddleUnderground.jpg') }}"
      data-panorama-front-altar-underground-src="{{ url_for('static', filename='360VirtualTour/front-AltarUnderground.jpg') }}"
      data-panorama-underground2-src="{{ url_for('static', filename='360VirtualTour/2Underground.jpg') }}"
      data-panorama-underground3-src="{{ url_for('static', filename='360VirtualTour/3Underground.jpg') }}"
      data-panorama-right-front-tombs-src="{{ url_for('static', filename='360VirtualTour/rightFrontTombs.jpg') }}"
      data-panorama-right-front-tombs1-src="{{ url_for('static', filename='360VirtualTour/1rightFrontTombs.jpg') }}"
      data-panorama-left-title="Left Front Gate Panorama"
      data-panorama-left-subtitle="Continue exploring from a left-side perspective of the front gate."
      data-panorama-flag-src="{{ url_for('static', filename='360VirtualTour/left-Flag.jpg') }}"
      data-panorama-middle-g-src="{{ url_for('static', filename='360VirtualTour/MiddleG-Museum.jpg') }}"
      data-panorama-front-museum-src="{{ url_for('static', filename='360VirtualTour/FrontMuseum.jpg') }}"
      data-panorama-inside-museum-src="{{ url_for('static', filename='360VirtualTour/InsideMuseum.jpg') }}"
      data-panorama-museum1-src="{{ url_for('static', filename='360VirtualTour/1Museum.jpg') }}"
      data-panorama-museum2-src="{{ url_for('static', filename='360VirtualTour/2Museum.jpg') }}"
      data-panorama-museum3-src="{{ url_for('static', filename='360VirtualTour/3Museum.jpg') }}"
    >
      <div class="tour-viewer" id="tourViewer" aria-label="Interactive 360 virtual tour"></div>

      <div class="tour-overlay tour-overlay--center" id="tourLoadingOverlay">
        <section class="tour-status-card">
          <p class="tour-status-card__title">Loading 360 view...</p>
          <p class="tour-status-card__copy">Preparing the panoramic scene for smooth navigation.</p>
        </section>
      </div>

      <div class="tour-overlay tour-overlay--center" id="tourErrorOverlay" hidden>
        <section class="tour-status-card tour-status-card--error">
          <p class="tour-status-card__title">Unable to load the panorama</p>
          <p class="tour-status-card__copy">Please refresh the page or return to Digital Exhibits and try again.</p>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="{{ url_for('static', filename='js/virtual-tour.js') }}"></script>
  </body>
</html>
