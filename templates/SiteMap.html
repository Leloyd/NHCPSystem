<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Site Map | Museo ng Libingan sa Ilalim ng Lupa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site-map.css') }}" />
  </head>
  <body class="site-map-body text-gray-900">
    {% set public_active_page = 'interactive' %}
    {% include 'partials/_public_top_nav.html' %}

    <main
      class="site-map-app"
      id="siteMapApp"
      data-image-map-root
      data-image-url="{{ url_for('static', filename='images/site-map/aerial-view.jpg') }}"
      data-hotspots-url="{{ url_for('static', filename='data/site-map-hotspots.json') }}"
    >
      <div id="interactiveMap" class="site-map-canvas" role="region" aria-label="Aerial map of the Nagcarlan Underground Cemetery"></div>

      <div class="site-map-overlay site-map-overlay--center" id="mapSearchOverlay" hidden>
        <section class="site-map-search-panel" role="dialog" aria-modal="true" aria-label="Search map hotspots">
          <div class="site-map-search-panel__header">
            <div>
              <p class="site-map-search-panel__kicker">Search map</p>
              <h2 class="site-map-search-panel__title font-serif">Find a hotspot quickly</h2>
            </div>
            <button id="mapSearchCloseBtn" type="button" class="site-map-search-panel__close" aria-label="Close search">×</button>
          </div>

          <label class="site-map-search-field" for="mapSearchInput">
            <span class="sr-only">Search hotspot names</span>
            <input id="mapSearchInput" type="search" placeholder="Search hotspots, landmarks, or spaces..." autocomplete="off" />
          </label>

          <div class="site-map-search-panel__actions">
            <button id="resetViewBtn" type="button" class="site-map-search-action">Reset View</button>
          </div>
        </section>
      </div>

      <div class="site-map-control-dock" aria-label="Site map controls">
        <button class="site-map-control-dock__action is-disabled" type="button" aria-disabled="true">
          <span class="site-map-control-dock__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 2.5 19.5 6v12L12 21.5 4.5 18V6L12 2.5Zm0 1.12L5.73 6.5 12 9.38l6.27-2.88L12 3.62Zm6.5 3.69-6 2.76v10.28l6-3V7.31Zm-13 0v7.74l6 3V10.07l-6-2.76Z" fill="currentColor"></path>
            </svg>
          </span>
          <span class="site-map-control-dock__label">Church</span>
        </button>
        <button class="site-map-control-dock__action is-disabled" type="button" aria-disabled="true">
          <span class="site-map-control-dock__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4.75 4h14.5c.41 0 .75.34.75.75v14.5a.75.75 0 0 1-.75.75H4.75a.75.75 0 0 1-.75-.75V4.75c0-.41.34-.75.75-.75Zm.75 1.5v13h13v-13h-13Zm2.25 2.25h8.5a.75.75 0 0 1 0 1.5h-8.5a.75.75 0 0 1 0-1.5Zm0 3.75h8.5a.75.75 0 0 1 0 1.5h-8.5a.75.75 0 0 1 0-1.5Zm0 3.75h5.5a.75.75 0 0 1 0 1.5h-5.5a.75.75 0 0 1 0-1.5Z" fill="currentColor"></path>
            </svg>
          </span>
          <span class="site-map-control-dock__label">Underground</span>
        </button>
        <button class="site-map-control-dock__camera" id="mapSearchOpenBtn" type="button" aria-label="Open search">
          <span class="site-map-control-dock__camera-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M10.03 4.97a7 7 0 1 1-4.95 11.95 7 7 0 0 1 4.95-11.95Zm0 1.5a5.5 5.5 0 1 0 3.89 9.39 5.5 5.5 0 0 0-3.89-9.39Zm8.44 11.88 2.31 2.31a.75.75 0 1 1-1.06 1.06l-2.31-2.31a.75.75 0 1 1 1.06-1.06Z" fill="currentColor"></path>
            </svg>
          </span>
        </button>
        <button class="site-map-control-dock__action is-active" id="mapToggleHotspotsBtn" type="button" aria-label="Toggle hotspot visibility" aria-pressed="true">
          <span class="site-map-control-dock__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 5c5.23 0 9.57 3.14 11 7-1.43 3.86-5.77 7-11 7S2.43 15.86 1 12c1.43-3.86 5.77-7 11-7Zm0 1.5c-4.32 0-7.98 2.48-9.37 5.5 1.39 3.02 5.05 5.5 9.37 5.5s7.98-2.48 9.37-5.5C19.98 8.98 16.32 6.5 12 6.5Zm0 2.25A3.25 3.25 0 1 1 8.75 12 3.25 3.25 0 0 1 12 8.75Zm0 1.5A1.75 1.75 0 1 0 13.75 12 1.75 1.75 0 0 0 12 10.25Z" fill="currentColor"></path>
            </svg>
          </span>
          <span class="site-map-control-dock__label">Hotspots</span>
        </button>
        <a class="site-map-control-dock__action" href="/interactive" aria-label="Back to Interactive">
          <span class="site-map-control-dock__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M10.53 5.47a.75.75 0 0 1 0 1.06L5.81 11.25H20a.75.75 0 0 1 0 1.5H5.81l4.72 4.72a.75.75 0 1 1-1.06 1.06l-6-6a.75.75 0 0 1 0-1.06l6-6a.75.75 0 0 1 1.06 0Z" fill="currentColor"></path>
            </svg>
          </span>
          <span class="site-map-control-dock__label">Back</span>
        </a>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', filename='js/landing.js') }}"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="{{ url_for('static', filename='js/site-map.js') }}"></script>
  </body>
</html>
