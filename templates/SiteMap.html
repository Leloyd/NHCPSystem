<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Site Map | Museo ng Libingan sa Ilalim ng Lupa</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/UndergroundLogo.jpg') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site-map.css') }}" />
  </head>
  <body class="site-map-body text-gray-900">
    <main
      class="site-map-app"
      id="siteMapApp"
      data-image-map-root
      data-image-url="{{ url_for('static', filename='images/site-map/aerial-map.jpg') }}"
      data-hotspots-url="{{ url_for('static', filename='data/site-map-hotspots.json') }}"
    >
      <div id="interactiveMap" class="site-map-canvas is-active" role="region" aria-label="Aerial map of the Nagcarlan Underground Cemetery" aria-hidden="false"></div>
      <div id="panoramaMap" class="site-map-canvas site-map-panorama" role="region" aria-label="360 aerial panorama of the Nagcarlan Underground Cemetery" aria-hidden="true"></div>

      <div id="mapInfoOverlay" class="map-info-overlay" hidden aria-live="polite">
        <svg id="mapInfoConnector" class="map-info-connector" aria-hidden="true" focusable="false" preserveAspectRatio="none">
          <defs>
            <linearGradient id="mapInfoConnectorGold" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#faf7f2"></stop>
              <stop offset="0.42" stop-color="#d4af6a"></stop>
              <stop offset="1" stop-color="#b8923a"></stop>
            </linearGradient>
          </defs>
          <path id="mapInfoConnectorShadow" class="map-info-connector__shadow"></path>
          <path id="mapInfoConnectorPath" class="map-info-connector__path"></path>
          <circle id="mapInfoConnectorOrigin" class="map-info-connector__origin" r="5"></circle>
          <circle id="mapInfoConnectorEnd" class="map-info-connector__end" r="3"></circle>
        </svg>
        <div id="mapInfoCard" class="map-info-card" role="dialog" aria-modal="false" aria-labelledby="mapInfoTitle">
          <button id="mapInfoDragHandle" class="map-info-card__drag-handle" type="button" aria-label="Drag the location information panel">
            <span class="map-info-card__drag-grip" aria-hidden="true"></span>
          </button>
          <button id="mapInfoClose" class="map-info-card__close" type="button" aria-label="Close location information">&times;</button>
          <h3 id="mapInfoTitle" class="map-info-card__title font-serif">Select a hotspot</h3>
          <p id="mapInfoMeta" class="map-info-card__meta">Category · Coordinates</p>
          <div id="mapInfoMedia" class="map-info-card__media" hidden></div>
          <p id="mapInfoSummary" class="map-info-card__summary">Tap a marker to view information directly on the map.</p>
          <div id="mapInfoLinks" class="map-info-card__links" hidden></div>
        </div>
      </div>

      <div class="site-map-loading" id="mapLoadingOverlay" aria-live="polite">
        <div class="site-map-loading__ring" aria-hidden="true"></div>
        <p class="site-map-loading__title" id="mapLoadingTitle">Museo ng Libingan<br /><em>sa Ilalim ng Lupa ng Nagcarlan</em><span id="mapLoadingCopy">Preparing the Site Map&hellip;</span></p>
      </div>

      <div class="site-map-transition" id="mapViewTransition" hidden aria-live="polite">
        <span class="site-map-transition__ring" aria-hidden="true"></span>
        <span id="mapViewTransitionText">Changing view&hellip;</span>
      </div>

      <div class="site-map-control-dock" aria-label="Site map controls" id="mapControlDock" hidden>
        <button class="site-map-control-dock__action site-map-control-dock__action--primary" id="mapViewModeBtn" type="button" aria-label="Switch to the 360 aerial view" aria-pressed="false">
          <span class="site-map-control-dock__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M3.5 5.25A1.75 1.75 0 0 0 1.75 7v10a1.75 1.75 0 0 0 1.75 1.75h17A1.75 1.75 0 0 0 22.25 17V7a1.75 1.75 0 0 0-1.75-1.75h-17Zm0 1.5h17c.14 0 .25.11.25.25v10a.25.25 0 0 1-.25.25h-17a.25.25 0 0 1-.25-.25V7c0-.14.11-.25.25-.25ZM12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Zm0 1.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-7.25 1.25h2a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5Zm12.5 0h2a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5Z" fill="currentColor"></path>
            </svg>
          </span>
          <span class="site-map-control-dock__label" id="mapViewModeLabel">360 View</span>
        </button>
        <button class="site-map-control-dock__action" id="mapLanguageBtn" type="button" aria-label="Toggle hotspot language" aria-pressed="false">
          <span class="site-map-control-dock__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4.75 4h14.5c.41 0 .75.34.75.75v14.5a.75.75 0 0 1-.75.75H4.75a.75.75 0 0 1-.75-.75V4.75c0-.41.34-.75.75-.75Zm.75 1.5v13h13v-13h-13Zm2.25 2.25h8.5a.75.75 0 0 1 0 1.5h-8.5a.75.75 0 0 1 0-1.5Zm0 3.75h8.5a.75.75 0 0 1 0 1.5h-8.5a.75.75 0 0 1 0-1.5Zm0 3.75h5.5a.75.75 0 0 1 0 1.5h-5.5a.75.75 0 0 1 0-1.5Z" fill="currentColor"></path>
            </svg>
          </span>
          <span class="site-map-control-dock__label" id="mapLanguageLabel">English</span>
        </button>
        <button class="site-map-control-dock__camera" id="resetViewBtn" type="button" aria-label="Reset view">
          <span class="site-map-control-dock__camera-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3.25a8.75 8.75 0 1 1-8.67 7.54.75.75 0 1 1 1.49.2A7.25 7.25 0 1 0 7.4 5.78H10a.75.75 0 0 1 0 1.5H4.75A.75.75 0 0 1 4 6.53V1.28a.75.75 0 0 1 1.5 0V4.7A8.7 8.7 0 0 1 12 3.25Z" fill="currentColor"></path>
            </svg>
          </span>
          <span class="site-map-control-dock__label" id="mapResetLabel">Reset</span>
        </button>
        <button class="site-map-control-dock__action is-active" id="mapToggleHotspotsBtn" type="button" aria-label="Toggle hotspot visibility" aria-pressed="true">
          <span class="site-map-control-dock__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 2.5a7 7 0 0 0-7 7c0 5.1 6.12 11.22 6.38 11.48a.88.88 0 0 0 1.24 0C12.88 20.72 19 14.6 19 9.5a7 7 0 0 0-7-7Zm0 1.5a5.5 5.5 0 0 1 5.5 5.5c0 3.75-4.11 8.4-5.5 9.86C10.61 17.9 6.5 13.25 6.5 9.5A5.5 5.5 0 0 1 12 4Zm0 2.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm0 1.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z" fill="currentColor"></path>
            </svg>
          </span>
          <span class="site-map-control-dock__label" id="mapHotspotsLabel">Hotspots</span>
        </button>
        <a class="site-map-control-dock__action" href="/interactive" aria-label="Back to Interactive">
          <span class="site-map-control-dock__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M10.53 5.47a.75.75 0 0 1 0 1.06L5.81 11.25H20a.75.75 0 0 1 0 1.5H5.81l4.72 4.72a.75.75 0 1 1-1.06 1.06l-6-6a.75.75 0 0 1 0-1.06l6-6a.75.75 0 0 1 1.06 0Z" fill="currentColor"></path>
            </svg>
          </span>
          <span class="site-map-control-dock__label" id="mapBackLabel">Back</span>
        </a>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', filename='js/site-analytics.js') }}"></script>
    <script src="{{ url_for('static', filename='js/landing.js') }}"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="{{ url_for('static', filename='js/site-map.js') }}"></script>
  </body>
</html>
