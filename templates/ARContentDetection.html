<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b1017" />
    <title>AR Content Detection</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/ar.css') }}" />

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/build/ar-threex.js"></script>
    <script defer src="{{ url_for('static', filename='js/ar-three-pipeline.js') }}"></script>
  </head>
  <body class="ar-body" data-ar-analytics-endpoint="{{ analytics_endpoint }}">
    <div class="ar-overlay ar-overlay--top ar-overlay--minimal">
      <a href="/digital-exhibits" class="ar-btn ar-btn--back">← Back</a>
    </div>

    <div id="arScene" aria-label="WebAR camera scene"></div>

    <script id="ar-three-config" type="application/json">
      {
        "markers": [
          {
            "key": "balanghay",
            "patternUrl": "{{ url_for('static', filename='AR-Artifacts/Balanghay/balanghay.patt') }}",
            "modelUrl": "{{ url_for('static', filename='AR-Artifacts/Balanghay/Balanghay-512(10K).glb') }}",
            "imageUrl": "/images/UndergroundLogo.jpg",
            "infoTitle": "Balanghay",
            "infoText": "The balanghay is an early Philippine wooden boat linked to precolonial maritime travel, trade, and community life."
          },
          {
            "key": "kabaong",
            "patternUrl": "{{ url_for('static', filename='AR-Artifacts/Kabaong/kabaong.patt') }}",
            "modelUrl": "{{ url_for('static', filename='AR-Artifacts/Kabaong/Kabaong-512(10k).glb') }}"
          },
          {
            "key": "banga",
            "patternUrl": "{{ url_for('static', filename='AR-Artifacts/Banga/banga.patt') }}",
            "modelUrl": "{{ url_for('static', filename='AR-Artifacts/Banga/Banga-512(10k).glb') }}"
          },
          {
            "key": "uloh",
            "patternUrl": "{{ url_for('static', filename='AR-Artifacts/Uloh/pattern-uloh-custom.patt') }}",
            "modelUrl": "{{ url_for('static', filename='AR-Artifacts/Uloh/Uloh-512(10k).glb') }}"
          },
          {
            "key": "tsapang",
            "patternUrl": "{{ url_for('static', filename='AR-Artifacts/Tsapang/pattern-tsapang-v2.patt') }}",
            "modelUrl": "{{ url_for('static', filename='AR-Artifacts/Tsapang/Tsapang-512(10k).glb') }}"
          },
          {
            "key": "kagamitan",
            "patternUrl": "{{ url_for('static', filename='AR-Artifacts/Kagamitan/pattern-kagamitan-custom.patt') }}",
            "modelUrl": "{{ url_for('static', filename='AR-Artifacts/Kagamitan/Kagamitan-512(10k).glb') }}"
          }
        ]
      }
    </script>
  </body>
</html>
