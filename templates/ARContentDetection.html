<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1017" />
    <title>AR Content Detection</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/ar.css') }}" />

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <script defer src="{{ url_for('static', filename='js/ar-page.js') }}"></script>
  </head>
  <body class="ar-body" data-ar-analytics-endpoint="{{ analytics_endpoint }}">
    <div class="ar-overlay ar-overlay--top ar-overlay--minimal">
      <a href="/digital-exhibits" class="ar-btn ar-btn--back">← Back</a>
    </div>

    <a-scene
      id="arScene"
      embedded
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: false; precision: mediump; logarithmicDepthBuffer: false"
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;"
    >
      <a-assets timeout="20000">
        <a-asset-item id="balanghayModel" src="{{ url_for('static', filename='AR-Artifacts/Balanghay/Balanghay.glb') }}"></a-asset-item>
        <a-asset-item id="kabaongModel" src="{{ url_for('static', filename='AR-Artifacts/Kabaong/Kabaong.glb') }}"></a-asset-item>
      </a-assets>

      <a-marker
        id="marker-balanghay"
        data-marker-key="balanghay"
        type="pattern"
        url="{{ url_for('static', filename='AR-Artifacts/Balanghay/balanghay.patt') }}"
        smooth="true"
        smooth-count="10"
        smooth-tolerance="0.02"
        smooth-threshold="5"
      >
        <a-entity
          id="model-balanghay"
          data-model-key="balanghay"
          gltf-model="#balanghayModel"
          visible="false"
        ></a-entity>
        <a-entity light="type: ambient; intensity: 0.62; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 0.84; color: #fff7ed" position="1.2 2.1 1.3"></a-entity>
      </a-marker>
      <a-marker
        id="marker-kabaong"
        data-marker-key="kabaong"
        type="pattern"
        url="{{ url_for('static', filename='AR-Artifacts/Kabaong/kabaong.patt') }}"
        smooth="true"
        smooth-count="10"
        smooth-tolerance="0.02"
        smooth-threshold="5"
      >
        <a-entity
          id="model-kabaong"
          data-model-key="kabaong"
          gltf-model="#kabaongModel"
          visible="false"
        ></a-entity>
        <a-entity light="type: ambient; intensity: 0.62; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 0.84; color: #fff7ed" position="1.1 2.1 1.2"></a-entity>
      </a-marker>

      <a-entity camera="near: 0.01; far: 1000"></a-entity>
    </a-scene>
  </body>
</html>
