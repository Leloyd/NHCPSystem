    <div class="ar-overlay ar-overlay--top ar-overlay--minimal">
      <a href="/digital-exhibits" class="ar-btn ar-btn--back" id="arBackButton">← Back</a>
    </div>
    <script>
      // Arrived from the Heritage Trail's Stop 3 (?from=stop3)? Back returns
      // there (the #stop-3 hash restores the stop). Otherwise: Digital Exhibits.
      (function () {
        try {
          if (new URLSearchParams(window.location.search).get("from") === "stop3") {
            document.getElementById("arBackButton").setAttribute("href", "/trail#stop-3");
          }
        } catch (e) { /* keep the default destination */ }
      })();
    </script>

    <div id="arScene" aria-label="WebAR camera scene"></div>

    <div class="ar-overlay ar-overlay--bottom ar-overlay--centered">
      <button id="arAudioLanguageToggle" class="ar-btn ar-btn--translation" type="button" aria-label="Audio unavailable until an artifact is detected" aria-disabled="true" disabled>
        Audio
      </button>
    </div>
