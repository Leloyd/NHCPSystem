    <title>AR Content Detection</title>

    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/UndergroundLogo.jpg') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ar.css') }}" />

  <body class="ar-body" data-ar-analytics-endpoint="{{ analytics_endpoint }}">
    <div id="arScene" aria-label="WebAR camera scene"></div>

    <!-- Marker narration subtitle + controls — shared Heritage design with the Virtual Tour. -->
    <div class="ar-dock" id="arControlDock" aria-label="AR artifact narration controls">
      <div class="ar-subtitle" id="arSubtitle" hidden aria-live="polite">
        <p class="ar-subtitle__eyebrow" id="arSubtitleEyebrow">Narration</p>
        <p class="ar-subtitle__text" id="arSubtitleText"></p>
      </div>

      <div class="ar-guidebar">
        <button class="ar-control-btn ar-control-btn--primary" id="arListen" type="button" aria-pressed="false" aria-label="Narration unavailable until an artifact is detected" aria-disabled="true" disabled>
          <svg class="ar-ico--play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 3l14 9-14 9V3z"/></svg>
          <svg class="ar-ico--pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
          <span id="arListenLabel">Listen</span>
        </button>
        <button class="ar-control-btn" id="arMute" type="button" aria-pressed="false" aria-label="Narration unavailable until an artifact is detected" aria-disabled="true" disabled>
          <svg class="ar-ico--sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>
          <svg class="ar-ico--sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
        </button>
        <button class="ar-control-btn" id="arLanguage" type="button" aria-label="Narration language unavailable" aria-disabled="true" disabled>TL</button>
        <button class="ar-control-btn is-active" id="arSubtitles" type="button" aria-pressed="true" aria-label="Subtitles unavailable until an artifact is detected" aria-disabled="true" disabled>CC</button>
        <button class="ar-control-btn ar-control-btn--march" id="arPahimakasMarch" type="button" aria-pressed="false" aria-label="Play the Pahimakas funeral march" hidden disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.75a.75.75 0 0 1 .75.75v10.84a3.5 3.5 0 1 1-1.5-2.88V8.91l-5.96 1.48a.75.75 0 0 1-.93-.73V5.93c0-.34.23-.64.56-.73l6.9-1.72a.76.76 0 0 1 .18-.03ZM8.75 6.52v2.18l6-1.49V5.02l-6 1.5Zm4.25 10.23a2 2 0 1 0-4 0 2 2 0 0 0 4 0Z" fill="currentColor"></path></svg>
        </button>
        <a class="ar-control-btn" id="arBackButton" href="/digital-exhibits" aria-label="Back to Digital Exhibits">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.53 5.47a.75.75 0 0 1 0 1.06L5.81 11.25H20a.75.75 0 0 1 0 1.5H5.81l4.72 4.72a.75.75 0 1 1-1.06 1.06l-6-6a.75.75 0 0 1 0-1.06l6-6a.75.75 0 0 1 1.06 0Z"/></svg>
        </a>
      </div>
