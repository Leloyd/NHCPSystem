<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heritage Trail | Museo ng Libingan sa Ilalim ng Lupa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/heritage-trail.css') }}" />
  </head>
  <body class="min-h-screen heritage-page text-gray-900">
    {% set public_active_page = 'heritage-trail' %}
    {% include 'partials/_public_top_nav.html' %}

    <main class="pt-20 heritage-page-main">
      <section class="container mx-auto px-4 heritage-shell-section">
        <div class="heritage-shell-frame">
          <div class="heritage-shell" id="heritageTrailShell" data-stop1-image="{{ url_for('static', filename='images/heritage-trail/Step01-Orientation.jpg') }}" data-panorama-front-gate="{{ url_for('virtual_tour_file', filename='FrontGate.jpg') }}" data-panorama-right-front-gate="{{ url_for('virtual_tour_file', filename='right-FrontGate.jpg') }}"></div>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', filename='js/landing.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="{{ url_for('static', filename='js/heritage-trail.js') }}"></script>
  </body>
</html>
