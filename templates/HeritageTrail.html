<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heritage Trail | Museo ng Libingan sa Ilalim ng Lupa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/heritage-trail.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/trail-guide.css') }}" />
    <script type="importmap">
      {
        "imports": {
          "three": "/webxr/static/vendor/three/three.module.js",
          "three/addons/": "/webxr/static/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="min-h-screen heritage-page text-gray-900">
    {% set public_active_page = 'heritage-trail' %}
    {% include 'partials/_public_top_nav.html' %}

    <!-- Arrival from the landing page: the golden iris opens onto the trail -->
    <div class="trail-arrival" data-trail-arrival aria-hidden="true">
      <p class="trail-arrival__title">
        Heritage Trail
        <span>Museo ng Libingan sa Ilalim ng Lupa</span>
      </p>
    </div>

    <main class="heritage-shell pt-20" id="heritageTrailShell" data-stop1-image="{{ url_for('static', filename='images/heritage-trail/Step01Pics/Step01-Orientation.jpg') }}" data-stop2-image="{{ url_for('static', filename='images/heritage-trail/Stop02Pics/Stop02-BG.jpg') }}" data-stop3-image="{{ url_for('static', filename='images/heritage-trail/Stop03Pics/Step03-Pics.jpg') }}" data-stop1-gallery-one="{{ url_for('static', filename='images/heritage-trail/Step01Pics/Step1-Pic1.jpg') }}" data-stop1-gallery-two="{{ url_for('static', filename='images/heritage-trail/Step01Pics/Step1-Pic2.jpg') }}" data-stop1-gallery-three="{{ url_for('static', filename='images/heritage-trail/Step01Pics/Step1-Pic3.jpg') }}" data-panorama-front-gate="{{ url_for('virtual_tour_file', filename='FrontGate.jpg') }}" data-panorama-right-front-gate="{{ url_for('virtual_tour_file', filename='right-FrontGate.jpg') }}" data-panorama-middle-g-museum="{{ url_for('virtual_tour_file', filename='MiddleG-Museum.jpg') }}" data-panorama-front-museum="{{ url_for('virtual_tour_file', filename='FrontMuseum.jpg') }}"></main>

    <!-- ================= Ana Kalang — Heritage Trail tour guide ================= -->
    <button id="tgLauncher" class="tg-launcher" type="button" aria-label="Open Ana Kalang, your trail guide" hidden>
      <span class="tg-launcher__avatar" aria-hidden="true"></span>
      <span class="tg-launcher__label"><strong>Ana Kalang</strong><span>Your trail guide</span></span>
    </button>

    <aside
      id="tgGuide"
      class="tg-guide"
      data-model-url="https://ayfudbwshjpjfxqrvdhq.supabase.co/storage/v1/object/public/nhcp-media/models/ana-kalang/AK-idle-1K.glb"
      data-greet-url="https://ayfudbwshjpjfxqrvdhq.supabase.co/storage/v1/object/public/nhcp-media/models/ana-kalang/AK-greet-1k.glb"
      data-heart-url="https://ayfudbwshjpjfxqrvdhq.supabase.co/storage/v1/object/public/nhcp-media/models/ana-kalang/AK-heart-1k.glb"
      aria-label="Ana Kalang trail guide"
    >
      <div class="tg-guide__bubble">
        <p class="tg-guide__eyebrow">Ana Kalang says</p>
        <p class="tg-guide__text" data-tg-text aria-live="polite"></p>
      </div>
      <div class="tg-guide__stage">
        <div class="tg-guide__canvas" data-tg-canvas></div>
        <div class="tg-guide__nameplate">Ana Kalang<span>Trail Guide</span></div>
        <div class="tg-guide__controls">
          <button class="tg-btn tg-btn--primary" type="button" data-tg-play aria-pressed="false" aria-label="Play narration">
            <svg class="tg-ico--play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 3l14 9-14 9V3z"/></svg>
            <svg class="tg-ico--pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
            <span>Listen</span>
          </button>
          <button class="tg-btn" type="button" data-tg-mute aria-pressed="false" aria-label="Mute narration">
            <svg class="tg-ico--sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>
            <svg class="tg-ico--sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
          </button>
          <button class="tg-btn" type="button" data-tg-lang aria-label="Switch narration language">EN</button>
          <span class="tg-guide__spacer"></span>
          <button class="tg-btn" type="button" data-tg-minimize aria-label="Minimize guide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <!-- =============== End Ana Kalang — Heritage Trail tour guide =============== -->

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', filename='js/landing.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="{{ url_for('static', filename='js/heritage-trail.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/trail-guide.js') }}"></script>
  </body>
</html>
