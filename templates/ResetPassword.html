<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Museo ng Libingan sa Ilalim ng Lupa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}" />
  </head>
  <body class="min-h-screen bg-stone-100 text-stone-900">
    {% set public_active_page = '' %}
    {% include 'partials/_public_top_nav.html' %}

    <main class="pt-28 pb-16 px-4">
      <div class="max-w-md mx-auto rounded-[2rem] border border-amber-200/70 bg-[#FAF6EF] shadow-2xl overflow-hidden">
        <div class="h-1 w-full" style="background: linear-gradient(90deg, #B8963E, #C9A84C, #B8963E);"></div>
        <div class="px-8 py-8">
          <div class="w-10 h-10 rounded-full mb-4 flex items-center justify-center bg-amber-100 text-amber-700">🔒</div>
          <h1 class="text-3xl font-serif text-stone-900">Reset Your Password</h1>
          <p class="mt-2 text-sm text-stone-600">Set a new password for your NHCP account.</p>

          {% if error_message %}
          <div class="mt-5 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ error_message }}</div>
          {% endif %}

          {% if token_valid %}
          <form method="post" class="mt-6 space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
            <input type="hidden" name="next" value="{{ next_url }}" />
            <input type="hidden" name="token" value="{{ token }}" />

            <div>
              <label for="resetPassword" class="block text-sm font-semibold text-stone-700 mb-2">New Password</label>
              <input id="resetPassword" name="password" type="password" required maxlength="128" class="w-full rounded-2xl border border-amber-200 bg-[#F0E6CC] px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-600/30" placeholder="Minimum 8 characters" />
            </div>

            <div>
              <label for="resetConfirmPassword" class="block text-sm font-semibold text-stone-700 mb-2">Confirm Password</label>
              <input id="resetConfirmPassword" name="confirm_password" type="password" required maxlength="128" class="w-full rounded-2xl border border-amber-200 bg-[#F0E6CC] px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-600/30" placeholder="Repeat your password" />
            </div>

            <button type="submit" class="w-full rounded-2xl px-5 py-3 font-semibold text-stone-100 transition hover:opacity-90" style="background: linear-gradient(135deg, #2C1A0E, #3D2B1F);">Update Password</button>
          </form>
          {% endif %}
        </div>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', filename='js/landing.js') }}"></script>
  </body>
</html>
